---
# Loopback only — nginx (hand-managed on the faucet host) terminates TLS for
# faucet.<domain> and proxies here, passing X-Real-IP for the rate limiter.
faucet_listen: "127.0.0.1:8590"
faucet_buffer_bundles: 10
faucet_per_ip_cooldown_secs: 3600
faucet_daily_cap: 500
# The local node's wRPC-borsh URL. The faucet host's marigoldd needs
# kaspad_extra_args to include --rpclisten-borsh=127.0.0.1:<port> (borsh is
# not started by default; loopback binding keeps the locked-down posture).
faucet_wrpc_url: "ws://127.0.0.1:27210"
faucet_network: "testnet-10"
# The Telegram Mini App at marigold.cash/app is the faucet's front inside
# Telegram; the browser lets it call the API only if the faucet says so.
faucet_cors_origin: "https://marigold.cash"
# The bot token, placed by hand on the host (never in this tree): with it the
# faucet verifies the Mini App's launch data and rate-limits per Telegram user
# rather than per IP. Absent file: per-IP only, and a warning at start.
faucet_telegram_bot_token_file: "/etc/marigold/telegram-bot.token"
