# Copy this file to inventory.ini and fill in your own IPs/users — inventory.ini is
# gitignored so your real infrastructure details never land in the repo.
#
# This example matches the topology recorded in docs/marigold/STATE.md's "Live
# infrastructure" section: three fixed-IP machines, two of them also running a
# stratum-bridge for an attached ASIC. Adjust roles/hosts/counts freely — nothing
# here is hardcoded to exactly three nodes.

[bootstrap]
# Run once per fresh machine, connecting as whatever admin account it actually
# ships with — root on most bare metal/VMs, or a pre-provisioned sudo account
# ("ubuntu", "admin", ...) on many cloud images. Change ansible_user below to
# match. This group's only job is creating the "deploy" account every other
# group below connects as — see roles/bootstrap.
seed1 ansible_host=203.0.113.10 ansible_user=root
seed2 ansible_host=203.0.113.11 ansible_user=root
seed3 ansible_host=203.0.113.12 ansible_user=root

[build]
# Exactly one host. Needs the Rust toolchain — this is the only machine that
# compiles anything; every other host just receives the built binaries.
seed1 ansible_host=203.0.113.10 ansible_user=deploy

[seed_nodes]
seed1 ansible_host=203.0.113.10 ansible_user=deploy kaspad_archival=true  kaspad_external_ip=203.0.113.10
seed2 ansible_host=203.0.113.11 ansible_user=deploy kaspad_addpeers=203.0.113.10:26211 kaspad_external_ip=203.0.113.11
seed3 ansible_host=203.0.113.12 ansible_user=deploy kaspad_addpeers=203.0.113.10:26211 kaspad_external_ip=203.0.113.12 kaspad_ram_scale=0.25

[bridges]
# Only hosts with an ASIC attached need this group.
seed1 ansible_host=203.0.113.10 ansible_user=deploy bridge_stratum_port=5555 bridge_min_share_diff=64
seed2 ansible_host=203.0.113.11 ansible_user=deploy bridge_stratum_port=5555 bridge_min_share_diff=64

[marigold:children]
seed_nodes
bridges
