---
# Shared defaults — override any of these per-host in inventory.ini, or copy this
# file's pattern into a group_vars/<groupname>.yml for a whole group at once.

# Bootstrap (roles/bootstrap, [bootstrap] inventory group only): the SSH login
# account every other play connects as. Must match the `ansible_user` you set
# for this host in every OTHER group in inventory.ini — the bootstrap role
# creates this account; it doesn't rename or reuse whatever ansible_user the
# [bootstrap] group itself connects as (that one's just the initial admin
# account your machine ships with — root, or a cloud image's default user —
# and is never touched beyond being used to create this one).
deploy_user: "deploy"
deploy_passwordless_sudo: true
# Path on the CONTROL machine to the public half of the key you'll SSH in
# with afterward. Generate one if you don't already have it:
#   ssh-keygen -t ed25519 -f ~/.ssh/marigold_deploy
deploy_ssh_public_key_file: "~/.ssh/id_ed25519.pub"

marigold_repo: "https://github.com/marigoldcash/marigold-node.git"
marigold_ref: "main"            # branch, tag, or commit to build and deploy
marigold_network: "testnet"     # testnet | mainnet | devnet | simnet

# P2P port marigoldd actually listens on for each network — must match
# consensus/core/src/network.rs's default_p2p_port() exactly, since this is what
# the firewall role opens. Testnet's is suffix-dependent; TESTNET_PARAMS in
# consensus/core/src/config/params.rs uses suffix 10.
marigold_p2p_ports:
  mainnet: 26111
  testnet: 26211
  simnet: 26511
  devnet: 26611

# gRPC port per network — never opened in the firewall (marigoldd's gRPC listener
# defaults to loopback-only whenever --rpclisten is omitted). Recorded here only
# so the systemd unit comment and the bridge's kaspad_address can point at the
# right local port without hardcoding it twice.
marigold_grpc_ports:
  mainnet: 26110
  testnet: 26210
  simnet: 26510
  devnet: 26610

marigold_user: "marigold"
marigold_install_root: "/opt/marigold"
marigold_data_root: "/var/lib/marigold"
marigold_config_root: "/etc/marigold"

# Where the build host checks out and builds the repo, and where the control
# machine caches fetched binaries between runs (keyed by commit, so re-running
# the playbook against an unchanged commit never re-copies anything — see the
# build role for why this matters: a stale binary has silently caused wrong
# behavior in this project more than once, see docs/marigold/NOTES.md's P2.3 and
# P4.2 entries).
marigold_build_checkout: "/opt/marigold-build/marigold-node"
marigold_fetch_cache: "{{ playbook_dir }}/.fetched"

# marigoldd defaults — a public seed node deliberately passes NONE of
# --rpclisten/--rpclisten-borsh/--rpclisten-json/--unsaferpc: gRPC then defaults to
# loopback-only and wRPC doesn't start at all (see docs/marigold/WALLET.md's and
# SMOKE.md's P7.7/P7.8 findings) — the safest possible posture is simply never
# passing those flags on a host reachable from the internet.
kaspad_archival: false
kaspad_addpeers: ""            # comma-separated "ip:port" list, or empty
kaspad_extra_args: ""          # escape hatch for anything not modeled below

# Bridge defaults (only applied to hosts in the `bridges` group)
bridge_stratum_port: 5555
bridge_min_share_diff: 64
bridge_prom_port: 2114
bridge_health_port: 8080

# Multi-instance support: a host can run more than one marigoldd/stratum-bridge/
# kaspa-miner at once (e.g. a testnet node + a mainnet node side by side) — each
# item below becomes one running, independently-managed systemd service, named
# by its `network`. The defaults here reproduce today's single-instance
# behavior from the flat vars above, so a host that never sets these directly
# is completely unaffected — override per-host in inventory.ini only when a
# host genuinely needs more than one instance of something.
marigold_node_instances:
  - network: "{{ marigold_network }}"
    archival: "{{ kaspad_archival }}"
    addpeers: "{{ kaspad_addpeers }}"
    extra_args: "{{ kaspad_extra_args }}"

marigold_bridge_instances:
  - network: "{{ marigold_network }}"
    stratum_port: "{{ bridge_stratum_port }}"
    min_share_diff: "{{ bridge_min_share_diff }}"
    prom_port: "{{ bridge_prom_port }}"
    health_port: "{{ bridge_health_port }}"

# Empty by default — only hosts in the `cpu_miners` inventory group need to set
# this. Each item needs `network` and `mining_address` (a real address you
# control — see roles/cpu-miner/tasks/main.yml, this is enforced, not just
# documented). `threads` is optional, falls back to cpu_miner_threads below.
marigold_cpu_miner_instances: []

# CPU miner (roles/cpu-miner) — kaspa-miner (elichai/kaspa-miner), the same
# tool this project's own testing has used since P0.4 (see NOTES.md). It's not
# part of this Cargo workspace, so the build role fetches and builds it
# separately. It talks gRPC directly to a co-located node over loopback — no
# stratum, no bridge, no port to add to any firewall; that's the whole appeal
# of a CPU miner over an ASIC here.
cpu_miner_git_repo: "https://github.com/elichai/kaspa-miner"
cpu_miner_git_ref: ""           # empty = always build the latest default branch;
                                 # set to a full commit SHA to pin (and cache) a build
cpu_miner_threads: 2

# Firewall is opt-in per host (see roles/marigoldd and roles/bridge) — set
# ufw_manage: true in inventory.ini only after confirming your SSH access rule
# survives (see TESTNET.md's firewall section). Never enabled by this playbook
# without that explicit flag: getting it wrong on a remote box with no console
# access means losing the box.
ufw_manage: false
