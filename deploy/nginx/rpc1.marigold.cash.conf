# Marigold wallet RPC — wss://rpc1.marigold.cash
#
# The wallet-facing half of the big rig's two-hostname arrangement:
#
#   tn-seed1.marigold.cash   plain DNS, real IP, p2p on 26211
#   rpc1.marigold.cash       plain DNS, real IP, 443 -> here
#
# Why two names on one machine: peer gossip carries raw IP bytes with no
# hostname field (protocol/p2p/proto/p2p.proto, message NetAddress), so a
# Cloudflare-proxied seed can neither be dialled by peers nor advertise itself.
# The p2p name must stay on its real IP. The RPC name has no such constraint,
# so it COULD take Cloudflare's orange cloud. It deliberately does not.
#
# On this machine the proxy would buy almost nothing. Hiding the origin is
# impossible while tn-seed1 publishes the same IP by design. The valid
# certificate browsers require — they refuse ws:// from an https:// page, which
# is what makes a web or mobile wallet possible at all — comes from Let's
# Encrypt here. Volumetric DDoS is already absorbed by Hetzner. What is left is
# L7 rate limiting, and nginx does that below.
#
# Against that, proxying would put a third party in the path who terminates TLS
# and can therefore read every balance query and transaction submission, and who
# can delay or drop them. Worth it for a node whose IP is genuinely secret —
# a dedicated RPC host that is not also a seed. Not worth it here.
#
# marigoldd binds wRPC to 127.0.0.1:27210 (host_vars/seed1.yml,
# marigold_wrpc_enabled). Nothing off-box reaches it; this is the only client.
# --unsaferpc is NOT set, so the exposed surface is the ordinary read/submit
# API, not node administration.
#
# Kept in the repo because nginx on this host is hand-managed: the file lives at
# /etc/nginx/sites-available/rpc1.conf and this is its source of truth.

server {
    server_name rpc1.marigold.cash;

    # wRPC is a WebSocket. Without the upgrade headers nginx would proxy the
    # handshake as an ordinary request and the connection would never form.
    location / {
        # A wallet needs exactly one connection. Eight is room for a person
        # with several wallets open behind one NAT, and far short of what it
        # takes to exhaust the node. Handshakes are capped separately: a
        # reconnect loop is normal, a thousand a minute is not.
        limit_conn rpc_conn 8;
        limit_req  zone=rpc_req burst=10 nodelay;

        proxy_pass http://127.0.0.1:27210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A wallet holds one connection open for its whole session and can be
        # silent for minutes between notifications. The default 60s read timeout
        # would drop it mid-use; an hour is longer than any sane idle period and
        # still bounded.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTP only here on purpose. `certbot --nginx -d rpc1.marigold.cash` adds
    # the 443 listener, the certificate paths and the port-80 redirect, exactly
    # as it did for faucet.conf — so the installed file grows certbot's
    # "managed by Certbot" lines and this copy stays the hand-written part.
    listen 80;
    listen [::]:80;
}
