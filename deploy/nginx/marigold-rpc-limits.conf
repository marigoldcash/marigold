# Connection limiting for the wallet RPC endpoint. Must live in the http{}
# context, hence its own file in conf.d/ rather than the vhost.
#
# This is the one thing a Cloudflare proxy would have added that the origin
# does not get for free: Hetzner's built-in DDoS protection is volumetric
# (L3/L4), so it stops a flood of packets but not a well-formed flood of
# WebSocket handshakes from a modest number of hosts. A wRPC connection costs
# the node real memory and a subscription slot, so that is worth bounding.
limit_conn_zone $binary_remote_addr zone=rpc_conn:10m;
limit_req_zone  $binary_remote_addr zone=rpc_req:10m rate=30r/m;
