# The desktop wallet (gui/), built natively on each platform like the terminal
# wallet in binaries.yaml. Bare executables for now: the system webview does
# the rendering (WebKitGTK on Linux, WebView2 on Windows 10/11, WebKit on
# macOS), so nothing is bundled with them yet. Run by hand with the
# marigold-wallet release tag to attach them, or empty to keep artifacts only.
name: Desktop wallet binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "marigold-wallet release tag to attach the binaries to (empty: artifacts only)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x86_64,  ext: "" }
          - { os: ubuntu-22.04-arm, name: linux-arm64,   ext: "" }
          - { os: macos-14,         name: macos-arm64,   ext: "" }
          - { os: macos-13,         name: macos-x86_64,  ext: "" }
          - { os: windows-latest,   name: windows-x86_64, ext: ".exe" }
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Ubuntu 22.04 on purpose: its WebKitGTK 4.1 and glibc are the oldest a
      # tester's Linux is likely to have, so the binary runs on newer ones too.
      - name: Install the webview toolkit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up cache
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.name }}
          workspaces: gui

      - name: Build
        run: cargo build --release --manifest-path gui/Cargo.toml

      - name: Name the binary
        shell: bash
        run: |
          mkdir -p out
          cp gui/target/release/marigold-wallet${{ matrix.ext }} out/marigold-wallet-${{ matrix.name }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: marigold-wallet-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to the marigold-wallet release
    needs: [build]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach
        env:
          GH_TOKEN: ${{ secrets.MARIGOLD_DOCKER_TOKEN }}
        run: |
          ls -la artifacts
          [ -n "$GH_TOKEN" ] || { echo "MARIGOLD_DOCKER_TOKEN is not set" >&2; exit 1; }
          gh release upload --repo marigoldcash/marigold-wallet "${{ inputs.release_tag }}" artifacts/* --clobber
