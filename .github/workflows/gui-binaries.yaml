# The desktop wallet (gui/), built natively on each platform like the terminal
# wallet in binaries.yaml: the bare executable and, since 2026-09-23, the
# installers people double-click — .deb and AppImage on Linux, .dmg on macOS,
# .msi on Windows — made by the Tauri CLI. The system webview does the
# rendering (WebKitGTK on Linux, WebView2 on Windows 10/11, WebKit on macOS).
# Unsigned until the founder decides on certificates. Run by hand with the
# marigold-wallet release tag to attach them, or empty to keep artifacts only.
name: Desktop wallet binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "marigold-wallet release tag to attach the binaries to (empty: artifacts only)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x86_64,   target: x86_64-unknown-linux-gnu,  ext: "",     bundles: "deb,appimage" }
          - { os: ubuntu-22.04-arm, name: linux-arm64,    target: aarch64-unknown-linux-gnu, ext: "",     bundles: "deb,appimage" }
          - { os: macos-14,         name: macos-arm64,    target: aarch64-apple-darwin,      ext: "",     bundles: "dmg" }
          # Intel macOS is built on the Apple Silicon runner: the Intel runners
          # sit in a queue for hours, and Apple's toolchain cross-builds fine.
          - { os: macos-14,         name: macos-x86_64,   target: x86_64-apple-darwin,       ext: "",     bundles: "dmg" }
          - { os: windows-latest,   name: windows-x86_64, target: x86_64-pc-windows-msvc,    ext: ".exe", bundles: "msi" }
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Ubuntu 22.04 on purpose: its WebKitGTK 4.1 and glibc are the oldest a
      # tester's Linux is likely to have, so the binary runs on newer ones too.
      - name: Install the webview toolkit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cache
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.name }}
          workspaces: gui

      # The Tauri CLI makes the installers; cached by version so it compiles once.
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri${{ matrix.ext }}
          key: tauri-cli-2-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the app and its installers
        working-directory: gui
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Name the binary and the installers
        shell: bash
        run: |
          mkdir -p out
          V=$(grep -m1 '^version' gui/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          cp gui/target/${{ matrix.target }}/release/marigold-wallet${{ matrix.ext }} out/marigold-wallet-${{ matrix.name }}${{ matrix.ext }}
          B=gui/target/${{ matrix.target }}/release/bundle
          for f in $B/deb/*.deb; do [ -f "$f" ] && cp "$f" out/marigold-wallet-$V-${{ matrix.name }}.deb; done
          for f in $B/appimage/*.AppImage; do [ -f "$f" ] && cp "$f" out/marigold-wallet-$V-${{ matrix.name }}.AppImage; done
          for f in $B/dmg/*.dmg; do [ -f "$f" ] && cp "$f" out/marigold-wallet-$V-${{ matrix.name }}.dmg; done
          for f in $B/msi/*.msi; do [ -f "$f" ] && cp "$f" out/marigold-wallet-$V-${{ matrix.name }}.msi; done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: marigold-wallet-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to the marigold-wallet release
    needs: [build]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach
        env:
          GH_TOKEN: ${{ secrets.MARIGOLD_DOCKER_TOKEN }}
        run: |
          ls -la artifacts
          [ -n "$GH_TOKEN" ] || { echo "MARIGOLD_DOCKER_TOKEN is not set" >&2; exit 1; }
          gh release upload --repo marigoldcash/marigold-wallet "${{ inputs.release_tag }}" artifacts/* --clobber
