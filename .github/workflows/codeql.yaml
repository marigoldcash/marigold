# CodeQL over the Rust code and the rest: GitHub's default setup offers no
# Rust, so this is the advanced setup, and it also covers what the default
# setup would (the workflows, the JavaScript, the Python), since the two
# cannot run side by side. Findings go to the Security tab; nothing here
# blocks a push. Weekly as well as on changes to main, so new queries run.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions, javascript-typescript, python]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
