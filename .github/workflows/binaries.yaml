# Wallet binaries for the platforms testers actually have.
#
# Native builds on native runners: the node inside the wallet pulls in RocksDB
# and secp256k1, which cross-compile badly from Linux and, for macOS, not
# legally at all. One macOS runner builds both Mac targets and folds them into
# a universal binary; Rosetta lets it run the Intel one for the report.
#
# Every job runs `marigold-cli --platform` on the binary it built, so a piece
# that is guarded out on that platform (disk-space check, mining priority,
# file permissions) shows up in this log rather than in a tester's hands.
#
# Run by hand: Actions → "Wallet binaries" → Run workflow. Give it the
# marigold_docker release tag to attach the binaries to, or leave it empty to
# keep them as workflow artifacts only. Attaching needs a MARIGOLD_DOCKER_TOKEN
# secret (a token that can write releases on marigoldcash/marigold_docker).
name: Wallet binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "marigold_docker release tag to attach the binaries to (empty: artifacts only)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,   target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc,   ext: ".exe" }
    steps:
      - name: Fix CRLF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p kaspa-cli --bin marigold-cli --features embedded-node --target ${{ matrix.target }}

      - name: Platform report
        shell: bash
        run: ./target/${{ matrix.target }}/release/marigold-cli${{ matrix.ext }} --platform

      - name: Name the binary
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/marigold-cli${{ matrix.ext }} out/marigold-cli-${{ matrix.name }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: marigold-cli-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macos (arm64, x86_64, universal)
    runs-on: macos-14
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Set up cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-both

      - name: Build for Apple Silicon
        run: cargo build --release -p kaspa-cli --bin marigold-cli --features embedded-node --target aarch64-apple-darwin

      - name: Build for Intel
        run: cargo build --release -p kaspa-cli --bin marigold-cli --features embedded-node --target x86_64-apple-darwin

      - name: Fold into one universal binary
        run: |
          mkdir -p out
          cp target/aarch64-apple-darwin/release/marigold-cli out/marigold-cli-macos-arm64
          cp target/x86_64-apple-darwin/release/marigold-cli out/marigold-cli-macos-x86_64
          lipo -create -output out/marigold-cli-macos-universal out/marigold-cli-macos-arm64 out/marigold-cli-macos-x86_64
          lipo -info out/marigold-cli-macos-universal

      - name: Platform report (Apple Silicon)
        run: ./out/marigold-cli-macos-arm64 --platform

      - name: Platform report (Intel, under Rosetta)
        run: arch -x86_64 ./out/marigold-cli-macos-x86_64 --platform

      - name: Platform report (universal)
        run: ./out/marigold-cli-macos-universal --platform

      - uses: actions/upload-artifact@v4
        with:
          name: marigold-cli-macos
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to the marigold_docker release
    needs: [build, macos]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach
        env:
          GH_TOKEN: ${{ secrets.MARIGOLD_DOCKER_TOKEN }}
        run: |
          ls -la artifacts
          if [ -z "$GH_TOKEN" ]; then
            echo "MARIGOLD_DOCKER_TOKEN is not set; the binaries are in this run's artifacts only." >&2
            exit 1
          fi
          gh release upload --repo marigoldcash/marigold_docker "${{ inputs.release_tag }}" artifacts/* --clobber
