[package]
name = "kaspa-wallet-cli-wasm"
description = "Kaspa CLI wallet for WASM"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait.workspace = true
js-sys.workspace = true
kaspa-cli.workspace = true
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
workflow-log.workspace = true
workflow-terminal.workspace = true
workflow-wasm.workspace = true

[lints]
workspace = true
# wasm-opt refuses the bundle without these: the Rust toolchain emits bulk
# memory and non-trapping float conversions by default now, and the wasm-opt
# that wasm-pack downloads validates against an older baseline. Without them
# the build still produces a working module and then fails on the very last
# step, which reads as a broken build when it is only an unoptimised one.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
