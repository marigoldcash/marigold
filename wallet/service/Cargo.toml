[package]
name = "kaspa-wallet-service"
description = "The Marigold wallet service: the operations behind the terminal wallet, the desktop app, the Telegram bot and the phone apps"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

# The service never depends on the terminal (workflow-terminal) or on kaspa-cli:
# the phone apps link it without either (docs/marigold/MOBILE-PLAN.md, PH-M1).
# The gRPC client joins in PH-M1c, gated off wasm32 as it is in the cli.
[dependencies]
chrono.workspace = true
faster-hex.workspace = true
flate2.workspace = true
hex.workspace = true
kaspa-bip32.workspace = true
kaspa-rpc-core.workspace = true
kaspa-wallet-core.workspace = true
kaspa-wrpc-client.workspace = true
log.workspace = true
rand.workspace = true
# Telegram uploads (multipart POST); the same reqwest workflow-http already builds.
reqwest = { version = "0.12.8", default-features = false, features = ["rustls-tls-webpki-roots", "multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
workflow-core.workspace = true
workflow-http.workspace = true
workflow-store.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true
