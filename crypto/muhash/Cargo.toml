[package]
name = "kaspa-muhash"
description = "Kaspa Muhash library"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaspa-hashes.workspace = true
kaspa-math.workspace = true
rand_chacha.workspace = true
serde.workspace = true

# For the exhuative tests, should only be enabled with release
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
rand.workspace = true

[[bench]]
name = "bench"
harness = false

[lints]
rust = { unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] } }

[lints.clippy]
empty_docs = "allow"
uninlined_format_args = "allow"
# This crate keeps its own tables for the fuzzing cfg, so the workspace's allow
# for clippy 1.98's chunk lint is repeated here.
chunks_exact_to_as_chunks = "allow"
