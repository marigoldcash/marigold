[package]
name = "kaspa-cli"
description = "Kaspa CLI"
keywords = ["kaspa", "wallet", "cli", "rpc"]
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = [
    "src/**/*.rs",
    "src/**/*.txt",
    "src/**/*.css",
    "Cargo.toml",
    "Cargo.lock",
]

[features]
default = []
# Compile a full node into the wallet binary. Off by default because it pulls
# the entire consensus tree (kaspa-consensus, rocksdb, mining) and turns a
# ~55 second CLI rebuild into a full node build; release builds for users turn
# it on. Nothing about the wallet changes when it is off — the node is opt-in at
# runtime too, via `node start`.
embedded-node = ["dep:kaspad", "dep:fs4"]
fs4 = ["dep:fs4"]

[[bin]]
name = "marigold-cli"
path = "src/main.rs"

[lib]
name = "kaspa_cli_lib"
crate-type = ["cdylib", "lib"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
borsh.workspace = true
cfg-if.workspace = true
convert_case.workspace = true
dashmap.workspace = true
downcast.workspace = true
faster-hex.workspace = true
flate2.workspace = true
futures.workspace = true
js-sys.workspace = true
hex.workspace = true
kaspa-addresses.workspace = true
kaspa-bip32.workspace = true
kaspa-consensus-core.workspace = true
kaspad = { workspace = true, optional = true }
kaspa-core.workspace = true
chrono.workspace = true
log.workspace = true
kaspa-daemon.workspace = true
kaspa-metrics-core.workspace = true
kaspa-pow.workspace = true
kaspa-rpc-core.workspace = true
kaspa-utils.workspace = true
kaspa-wallet-core.workspace = true
kaspa-wallet-keys.workspace = true
kaspa-wallet-pskt.workspace = true
kaspa-wrpc-client.workspace = true
nw-sys.workspace = true
num_cpus.workspace = true
rand.workspace = true
pad.workspace = true
qrcode.workspace = true
regex.workspace = true
separator.workspace = true
serde_json.workspace = true
serde.workspace = true
textwrap.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
workflow-core.workspace = true
workflow-dom.workspace = true
workflow-log.workspace = true
workflow-node.workspace = true
workflow-nw.workspace = true
workflow-store.workspace = true
workflow-terminal.workspace = true
workflow-wasm.workspace = true
libc = "0.2"
fs4 = { version = "0.13", default-features = false, features = ["sync"], optional = true }

[dependencies.web-sys]
workspace = true
features = [
    'console',
    'Document',
    'Window',
    'Node',
    'Element',
    'HtmlElement',
    'DomTokenList',
    # 'HtmlElement',
    # 'CustomEvent',
    # 'MouseEvent'
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }


[lints]
workspace = true
